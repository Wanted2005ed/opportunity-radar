name: Opportunity Radar discovery refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Opportunity Desk RSS
        shell: python
        run: |
          import json, urllib.request, xml.etree.ElementTree as ET, re
          url="https://opportunitydesk.org/feed/"
          req=urllib.request.Request(url,headers={"User-Agent":"OpportunityRadar/1.0"})
          try:
            xml=urllib.request.urlopen(req,timeout=30).read()
            root=ET.fromstring(xml)
            items=[]
            for item in root.findall(".//item")[:30]:
              title=(item.findtext("title") or "").strip()
              link=(item.findtext("link") or "").strip()
              desc=re.sub(r"<[^>]+>"," ",item.findtext("description") or "").strip()
              if title and link:
                items.append({"title":title,"category":"Opportunity","region":"Global/Africa","description":desc[:500],"why_it_fits":"New public lead. Verify eligibility and deadline at the original source.","source_name":"Opportunity Desk","source_url":link,"verified":False,"score":60})
            open("data/feed.json","w",encoding="utf-8").write(json.dumps(items,ensure_ascii=False,indent=2))
          except Exception as e:
            print("Feed refresh failed:",e)
      - name: Commit refreshed discovery feed
        run: |
          git config user.name "Opportunity Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || git commit -m "chore: refresh opportunity discovery feed"
          git push
